version: '3.8'

services:
  web:
    build: .
    command: gunicorn smartinvoice.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=smartinvoice
      - POSTGRES_USER=smartinvoice
      - POSTGRES_PASSWORD=smartinvoice

  redis:
    image: redis:7-alpine

  worker:
    build: .
    command: celery -A smartinvoice worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
